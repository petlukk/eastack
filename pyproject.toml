[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "eastack"
version = "0.1.0"
description = "SIMD-accelerated frame stacking. Batched accumulation with reduced memory traffic."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Peter Lukka" }]
keywords = ["stacking", "simd", "astronomy", "image-processing", "avx2", "frame-averaging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.21"]

[project.urls]
Homepage = "https://github.com/petlukk/eastack"
Repository = "https://github.com/petlukk/eastack"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eastack = ["lib/*.so", "lib/*.dll", "py.typed"]
